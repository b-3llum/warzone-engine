name = "warzone-rating-engine"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[observability]
enabled = true

# Create with: npx wrangler kv namespace create WARZONE_RATINGS
# then paste the returned id below (and the --preview id into preview_id).
[[kv_namespaces]]
binding = "WARZONE_RATINGS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

# Secrets (NOT stored here):
#   npx wrangler secret put API_TOKEN
